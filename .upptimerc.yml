sites:
  - name: Client Onboarding — Prod
    url: https://clientonboarding.wealthtechpros.com
  - name: Client Onboarding — Login
    url: https://login.clientonboarding.wealthtechpros.com
  - name: Client Onboarding — Benchmark
    url: https://benchmark.clientonboarding.wealthtechpros.com
  - name: Client Onboarding — Staging
    url: https://staging.clientonboarding.wealthtechpros.com
  # Product renamed SGD -> SGE (Specification-Governed Engineering) 2026-08-04.
  # URL deliberately NOT switched to sge.wealthtechpros.com yet — DNS exists but
  # it doesn't resolve/serve (curl-verified 2026-08-04); flipping it now would
  # false-alarm an outage. Swap once sge.wealthtechpros.com is confirmed live.
  - name: SGE
    url: https://sgd.wealthtechpros.com
  - name: WTP MCP
    url: https://mcp.wealthtechpros.com
  # ---- Added 2026-07-02 (org sweep, all curl-verified live first) ----
  - name: WTP Marketing Site
    url: https://wealthtechpros.com
  - name: Project Management
    url: https://projectmanagement.wealthtechpros.com
  - name: WTP Assistant
    url: https://assistant.wealthtechpros.com
  - name: Trust Fabric
    url: https://trust.wealthtechpros.com
  # The root-domain monitor above only proves the app is up, not that its
  # authenticated staff area works — it missed a real /internal 500 outage
  # entirely (2026-08-02) because Upptime only checks the exact URL given,
  # never sub-routes. /internal has no auth gate at the point of failure
  # (confirmed: an unauthenticated curl gets a raw 500, not a redirect), so
  # monitoring it directly is meaningful today. The existing /api/health and
  # /healthz endpoints were considered instead but rejected — they're pure
  # build-identity liveness checks (no DB/route logic) and were reporting
  # "ok" throughout this same outage, so they would not have caught it.
  # If auth is ever added in front of /internal, a clean unauthenticated hit
  # would likely start 30x-redirecting to login — widen expectedStatusCodes
  # then (see the Adviser MCP entry below for the pattern), don't just delete
  # this monitor.
  - name: Trust Fabric — Internal
    url: https://trust.wealthtechpros.com/internal
    expectedStatusCodes:
      - 200
      - 302
      - 307
  # Complements "Trust Fabric — Internal" above rather than duplicating it — that entry proves
  # the /internal PAGE doesn't 5xx (a page-level signal). This one polls a dedicated deep
  # health-check endpoint (WealthTechPros/trust-fabric#283) that server-side exercises the SAME
  # NextAuth JWT encode/decode round-trip getToken() performs against the real NEXTAUTH_SECRET,
  # plus a live DB round-trip through the app's evidence store — built specifically because
  # /api/health and /healthz (pure build-identity liveness checks, no auth/DB) kept reporting
  # "ok" throughout the SAME /internal outage referenced above. Returns a plain 200 (both checks
  # pass) or 503 (naming which check failed in its JSON body — never a secret value or DB
  # content), so no expectedStatusCodes override is needed: a 503 IS the down signal.
  - name: Trust Fabric — Deep Health
    url: https://trust.wealthtechpros.com/api/health/deep
  - name: Client Document Portal
    url: https://portals.wealthtechpros.com
  # Adviser MCP sits behind a Cloudflare Access gate: curl gets 403, a browser
  # gets 302 to the CF login. Without expectedStatusCodes Upptime would read
  # it as permanently down. Swap to an unauthenticated /health path if one
  # is ever exposed.
  - name: Adviser MCP
    url: https://adviser-mcp.wealthtechpros.com
    expectedStatusCodes:
      - 200
      - 302
      - 403
  # demo.clientonboarding.wealthtechpros.com deliberately NOT monitored —
  # live but a demo env that may be parked between sessions; monitoring it
  # would open false-alarm incidents (decision 2026-07-02, Rob to revisit).
  # www / benchmark.wealthtechpros.com / staging.sgd. skipped — same origins
  # as already-monitored services (no extra signal).
  # Platform Automation Proxy — OFF. proxy.wealthtechpros.com does not resolve
  # yet (NXDOMAIN — the proxy is not deployed at that hostname).
  # The monitor was removed in #4; its auto-opened downtime incident (#1) was a
  # FALSE ALARM (placeholder host, never deployed) and has been closed manually
  # — Upptime cannot auto-close it once the monitor is gone (wtp-org #53).
  # re-enable when proxy.wealthtechpros.com is live (not yet deployed, 2026-06-24)
  # - name: Platform Automation Proxy
  #   url: https://proxy.wealthtechpros.com
  # SFTP — intentionally OFF. The Azure SFTP feature costs ~£160/mo just to be
  # enabled, so it goes up ONLY for a paying client (decision 2026-06-20).
  # Re-add this monitor when wtp-sftp is live with enable_sftp=true:
  # - name: SFTP
  #   url: tcp://FILL_IN_SFTP_HOSTNAME:22

