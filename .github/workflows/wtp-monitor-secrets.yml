name: Monitor secret scope
on:
  pull_request:
    paths:
      - .upptimerc.yml
      - .github/workflows/**
      - tests/upptime-secrets.spec.js
  push:
    branches: [master]
    paths:
      - .upptimerc.yml
      - .github/workflows/**
      - tests/upptime-secrets.spec.js
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        generator: [74f0683383384927e064d76a5f21f340d6af36fc, latest-release, master]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        name: Read status configuration
        with:
          persist-credentials: false
      - name: Resolve the release used by regenerated Setup CI
        id: release
        run: |
          tag=$(curl --retry 2 --fail --silent --show-error 'https://api.github.com/repos/upptime/uptime-monitor/releases?per_page=1' |
            jq -er '.[0].tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: upptime/uptime-monitor
          ref: ${{ matrix.generator == 'latest-release' && steps.release.outputs.tag || matrix.generator }}
          path: generator
          persist-credentials: false
      - name: Test the committed and regenerated monitor definitions
        working-directory: generator
        env:
          STATUS_ROOT: ${{ github.workspace }}
          UPPTIME_RELEASE: ${{ steps.release.outputs.tag }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cp ../.upptimerc.yml .
          cp ../tests/upptime-secrets.spec.js src/helpers/
          node_modules/.bin/jest --runInBand --runTestsByPath src/helpers/upptime-secrets.spec.js
