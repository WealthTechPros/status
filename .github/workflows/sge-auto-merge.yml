# SGE Auto-Approve & Merge — caller stub.
# ---------------------------------------
# The gate itself lives ONCE, in wtp-org: .github/workflows/auto-merge-reusable.yml.
# Do NOT copy gate logic in here. Before the fleet moved to a reusable workflow, 23
# repos each vendored the gate and 22 shared one identical fail-open (wtp-org#777) —
# an empty check set was read as "no CI configured" and merged on the label alone.
# One file, one fix.
#
# Migrated from this repo's own inline sge-auto-merge.yml (wtp-org#777). That inline
# copy predated both the pr_ci_expected() fail-closed probe AND the SELF_WF
# context-derived fix — it hardcoded SELF_WF="SGE Auto-Approve & Merge" as a string
# literal, so any drift between this file's `name:` and that literal would have
# silently broken self-exclusion. The reusable gate fixes both.
#
# WHAT STAYS LOCAL, and why it is not just boilerplate:
#   * `pull_request_target: types: [labeled]` — a reusable workflow cannot declare
#     `on:`. `labeled` ONLY: `synchronize` is excluded so a push after labelling
#     cannot ride the stale label, and `reopened`/`ready_for_review` are excluded
#     because their event head is already the current commit, so EVENT_SHA would
#     match the live head and the drift check would pass — letting a
#     close→push→reopen sequence merge unreviewed code on a surviving label.
#     Re-applying `pr-reviewed` (remove+add) is the re-review signal.
#   * the label guard — visible here so a repo can see what gates its own merges.
#     Gates ONLY on `pr-reviewed` + non-draft, deliberately NOT on the absence of
#     `hold`/`do-not-merge`/`needs-human`/`blocked` (wtp-org#781): a single combined
#     `gh pr edit --add-label pr-reviewed --remove-label hold` fires ONE `labeled`
#     event whose payload snapshot can still list `hold` even though it is being
#     removed in the same call. The gate re-derives hold state itself from a FRESH
#     live read (its first action, before anything else runs).
#   * `concurrency` — per-PR, never cancel-in-progress (a cancelled merge mid-flight
#     is worse than a slow one).
#   * `secrets: inherit` — passes the ORG secrets WTP_AUTOMATION_APP_ID /
#     WTP_AUTOMATION_PRIVATE_KEY without restating them per repo.

name: SGE Auto-Approve & Merge

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sge-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'pr-reviewed')
    uses: WealthTechPros/wtp-org/.github/workflows/auto-merge-reusable.yml@main
    secrets: inherit
